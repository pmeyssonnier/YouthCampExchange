name: Rebuild generated files
# Régénère js/assets.js (modèles embarqués + version de build), camps.json,
# docs/codemap-data.js et les empreintes ?v= des pages après chaque push sur main — y compris les commits faits
# par la page d'administration (yce_admin.html) via l'API GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # déclenchement manuel depuis l'onglet Actions (secours)

permissions:
  contents: write

concurrency:
  group: rebuild-main
  cancel-in-progress: true

jobs:
  rebuild:
    # le commit du bot porte [skip ci] : pas de boucle
    runs-on: ubuntu-latest
    steps:
      # actions figées par empreinte de commit (une étiquette @vX peut être déplacée)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Rebuild generated files
        run: |
          python tools/build_assets.py
          python tools/build_codemap.py
          # empreinte de contenu dans ?v= : les données enregistrées par l'administration
          # (camps_data.js, districts_data.js) ne restent pas en cache dans les navigateurs
          python tools/stamp_version.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/assets.js camps.json docs/codemap-data.js docs/CODE_MAP.md *.html
          git diff --cached --quiet && echo "Nothing to rebuild" && exit 0
          git commit -m "Rebuild generated files [skip ci]"
          git push

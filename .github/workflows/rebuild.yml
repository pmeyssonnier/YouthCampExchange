name: Rebuild generated files
# Régénère js/assets.js (modèles embarqués + version de build), camps.json et
# docs/codemap-data.js après chaque push sur main — y compris les commits faits
# par la page d'administration (yce_admin.html) via l'API GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # déclenchement manuel depuis l'onglet Actions (secours)

permissions:
  contents: write

concurrency:
  group: rebuild-main
  cancel-in-progress: true

jobs:
  rebuild:
    # le commit du bot porte [skip ci] : pas de boucle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild generated files
        run: |
          python tools/build_assets.py
          python tools/build_codemap.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/assets.js camps.json docs/codemap-data.js
          git diff --cached --quiet && echo "Nothing to rebuild" && exit 0
          git commit -m "Rebuild generated files [skip ci]"
          git push

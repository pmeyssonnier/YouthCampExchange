name: Tests
# Tests de sécurité et de non-régression (tests/) : échappement XSS, limites ZIP, accès
# administrateur, commits atomiques, règles d'accès du coffre (PostgreSQL), pages sans erreur.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions figées par empreinte de commit (une étiquette @vX peut être déplacée)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generators still run
        run: |
          python tools/build_assets.py
          python tools/build_codemap.py
      - name: Install test dependencies
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run tests
        working-directory: tests
        run: npm test
